# =============================================================================
# Live Pairs Trading Algorithm - Configuration Settings
# =============================================================================
# This file contains all tunable parameters for the live pairs trading algorithm.
# Modify these values to adjust the algorithm's behavior.
#
# IMPORTANT: Changes to this file require a restart of the algorithm.
# =============================================================================

# -----------------------------------------------------------------------------
# Environment Selection
# -----------------------------------------------------------------------------
# Controls whether the algorithm runs against simulation or production API.
#
# Values:
#   "sim"  - Paper trading (simulation) - SAFE, no real money
#   "prod" - Live trading - REAL MONEY AT RISK
#
# WARNING: Setting this to "prod" will execute REAL trades with REAL money!
# Double-check your configuration before switching to prod.

environment: "sim"

# -----------------------------------------------------------------------------
# Trading Pair Configuration
# -----------------------------------------------------------------------------
# The algorithm trades between two correlated stocks, swapping positions
# when their price ratio deviates significantly from its moving average.
#
# ratio = ticker_a_price / ticker_b_price
# When ratio is HIGH relative to MA: ticker_a is overvalued, buy ticker_b
# When ratio is LOW relative to MA: ticker_b is overvalued, buy ticker_a

ticker_a: "V"      # First stock in the pair (numerator of ratio)
ticker_b: "MA"     # Second stock in the pair (denominator of ratio)

# -----------------------------------------------------------------------------
# Algorithm Parameters
# -----------------------------------------------------------------------------
# These parameters control the core trading logic and must match the
# historical simulation settings for consistent behavior.

# Trigger threshold: minimum % deviation from MA to initiate a swap
# Example: 0.4 means swap when ratio is 0.4% above or below MA
trigger_percent: 0.1

# Moving average window in minutes
# The algorithm calculates MA over this many 1-minute bars
# 240 minutes = 4 hours of trading data
moving_average_window_minutes: 240

# Maximum number of trades (swaps) allowed per trading day
# Set to 0 for unlimited trades
# Note: The initial buy counts toward this limit
trades_per_day_limit: 10

# Secondary safety check: enforce a hard limit of 1 trade per day
# When true, this acts as an additional check on top of trades_per_day_limit
# Both checks must pass for a trade to execute
# This is a safety net against configuration errors
enforce_one_trade_per_day: true

# -----------------------------------------------------------------------------
# Performance Tracking Timeframes
# -----------------------------------------------------------------------------
# Timeframes for calculating and reporting performance metrics.
# Format: "Nd" for days, "Nh" for hours (e.g., "7d", "24h", "60d")
# Performance is tracked as compound return multipliers.

performance_timeframes:
  - "7d"
  - "60d"

# -----------------------------------------------------------------------------
# Slippage Estimation Model
# -----------------------------------------------------------------------------
# Parameters for estimating expected slippage (market impact).
# Used to compare expected vs actual slippage after trades execute.
# These values should be calibrated to the specific stocks being traded.

slippage:
  # Annualized volatility of the stocks (decimal, not percent)
  # Example: 0.15 = 15% annual volatility
  volatility: 0.15
  
  # Average daily trading volume in shares
  # Used to calculate market impact as a function of trade size
  average_daily_volume: 6000000
  
  # Market impact coefficient (typically 0.001 to 0.01)
  # Higher values = more conservative slippage estimates
  impact_coefficient: 0.0055
  
  # SEC fee rate (applies to sell orders only)
  # Current rate is $0.0000278 per dollar of sale proceeds
  sec_fee_rate: 0.0000278

# -----------------------------------------------------------------------------
# Operational Settings
# -----------------------------------------------------------------------------
# These settings control how the algorithm operates in real-time.

# How often to poll for new quotes (in seconds)
# 1 second provides near-real-time price updates
poll_interval_seconds: 1

# How often to reconcile internal state with TradeStation API (in seconds)
# This verifies our position tracking matches actual holdings
reconciliation_interval_seconds: 60

# Number of times to retry failed API calls before halting
retry_attempts: 3

# Backoff delay between retries (in seconds)
# Actual delay = retry_backoff_seconds * retry_number
retry_backoff_seconds: 2

# Minutes before market close to stop initiating new swaps
# This ensures both legs of a swap can complete before close
# Example: 10 means no new swaps after 3:50 PM ET
swap_cutoff_minutes_before_close: 10

# Enable 24-hour trading mode (bypass market hours restrictions)
# When true, ignores market hours and swap cutoff checks
# Useful for trading assets that trade 24/7 (crypto, futures)
# When false, respects standard market hours (9:30 AM - 4:00 PM ET)
# Default: false
enable_24h_trading: true

# -----------------------------------------------------------------------------
# Allocated Cash for Trading (Optional Demo/Testing Limit)
# -----------------------------------------------------------------------------
# When set to a positive value, the algorithm will always buy stock worth
# approximately this dollar amount, regardless of account balance or profits.
# This provides consistent position sizing for testing and demo purposes.
#
# How it works:
#   - When buying: Purchases floor(allocated_cash / stock_price) shares
#   - When selling: Sells ALL shares (as always)
#   - Position value will fluctuate with price changes between buys/sells
#
# Values:
#   0 or null - Uses full account buying power (default behavior)
#               Positions grow exponentially with profits
#   Positive number - Always buys this dollar amount worth of stock
#                     (e.g., 1000 = always buy ~$1000 worth)
#                     Positions stay relatively constant in size
#
# Example: Set to 1000 to always buy approximately $1000 worth of stock
#          V at $300 → buy 3 shares ($900)
#          MA at $500 → buy 2 shares ($1000)

allocated_cash: 1000

# -----------------------------------------------------------------------------
# Terminal Logging Verbosity
# -----------------------------------------------------------------------------
# Controls how much the algorithm logs to the terminal.
# This does NOT affect Grafana/Loki logging (always full).
#
# Levels:
#   0 - ERROR:   Only critical errors
#   1 - WARNING: Errors + warnings
#   2 - INFO:    Normal operational logs (recommended for trading)
#   3 - VERBOSE: Includes high-frequency data (every poll cycle)
#   4 - DEBUG:   Everything including detailed diagnostics
#
# Note: VERBOSE (3) will print every second. Use INFO (2) for cleaner output.

log_level: 3  # VERBOSE - everything including detailed diagnostics

